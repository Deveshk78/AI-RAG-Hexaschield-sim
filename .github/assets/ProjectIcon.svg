<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    
    <!-- Shield Outer Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Shield Inner Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172A45" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.25" stroke-dasharray="10 6" />

  <!-- Hexagonal Circuit Nodes behind Shield -->
  <g stroke="#4FACFE" stroke-width="2" fill="none" opacity="0.35">
    <polygon points="256,70 360,130 360,250 256,310 152,250 152,130" stroke-dasharray="4 4" />
    <circle cx="256" cy="70" r="6" fill="#00F2FE" />
    <circle cx="360" cy="130" r="6" fill="#00F2FE" />
    <circle cx="360" cy="250" r="6" fill="#00F2FE" />
    <circle cx="152" cy="130" r="6" fill="#00F2FE" />
    <circle cx="152" cy="250" r="6" fill="#00F2FE" />
  </g>

  <!-- Main Shield Silhouette -->
  <path d="M256 64 C330 64, 400 90, 420 120 C420 260, 360 380, 256 448 C152 380, 92 260, 92 120 C112 90, 182 64, 256 64 Z" 
        fill="url(#coreGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="10" 
        filter="url(#glow)" />

  <!-- Internal Shield Neon Highlights -->
  <path d="M256 86 C318 86, 380 108, 398 134 C398 246, 344 350, 256 418 C168 350, 114 246, 114 134 C132 108, 194 86, 256 86 Z" 
        fill="none" 
        stroke="#00F2FE" 
        stroke-width="2" 
        opacity="0.6" />

  <!-- Neural Network / AI Nodes inside Shield -->
  <g stroke="#00F2FE" stroke-width="3" opacity="0.85">
    <!-- Connecting neural lines -->
    <line x1="256" y1="160" x2="190" y2="240" />
    <line x1="256" y1="160" x2="322" y2="240" />
    <line x1="190" y1="240" x2="256" y2="310" />
    <line x1="322" y1="240" x2="256" y2="310" />
    <line x1="190" y1="240" x2="150" y2="210" />
    <line x1="322" y1="240" x2="362" y2="210" />
    <line x1="256" y1="160" x2="256" y2="120" />

    <!-- Core Neural Nodes -->
    <circle cx="256" cy="120" r="7" fill="#FFF" />
    <circle cx="256" cy="160" r="9" fill="#00F2FE" />
    <circle cx="190" cy="240" r="8" fill="#4FACFE" />
    <circle cx="322" cy="240" r="8" fill="#4FACFE" />
    <circle cx="256" cy="310" r="11" fill="#00F2FE" />
    <circle cx="150" cy="210" r="6" fill="#FFF" />
    <circle cx="362" cy="210" r="6" fill="#FFF" />
  </g>

  <!-- Central Pulsing AI Core Symbol -->
  <circle cx="256" cy="240" r="14" fill="#00F2FE" opacity="0.3" />
  <circle cx="256" cy="240" r="7" fill="#FFFFFF" filter="url(#glow)" />
</svg>
